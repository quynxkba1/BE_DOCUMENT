# ClickHouse local dev setup
# Start: docker-compose -f docker-compose.clickhouse.yml up -d
# Stop:  docker-compose -f docker-compose.clickhouse.yml down
# Shell: docker exec -it clickhouse-dev clickhouse-client

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-dev
    ports:
      - '8123:8123'   # HTTP interface — curl / UI / @clickhouse/client
      - '9000:9000'   # Native TCP interface — used by Node.js client
    environment:
      CLICKHOUSE_DB: dex_scanner
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  clickhouse_data:
